<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline | Dòng chảy lịch sử</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="page-header">
    <a href="index.html" class="back-link">&larr; Trang chủ</a>
    <h1>DÒNG CHẢY LỊCH SỬ</h1>
    <p>Nhấp vào từng mốc thời gian để xem tư liệu</p>
  </header>

  <!-- Timeline được JavaScript tự sinh ra ở đây -->
  <main class="timeline" id="timeline"></main>

  <!-- Trang kết -->
  <footer class="ending">
    <h2>HÀNH TRÌNH LỊCH SỬ</h2>
    <div class="ending-years" id="endingYears"></div>
    <p>Những dấu mốc quan trọng của Đảng Cộng sản Việt Nam</p>
    <button class="btn-explore" onclick="window.scrollTo({top:0, behavior:'smooth'})">
      XEM LẠI TIMELINE
    </button>
  </footer>

  <!-- Popup chi tiết -->
  <div class="modal" id="modal">
    <div class="modal-box">
      <button class="modal-close" id="modalClose">&times;</button>
      <div class="modal-year" id="modalYear"></div>
      <h2 class="modal-title" id="modalTitle"></h2>
      <img class="modal-img" id="modalImg" src="" alt="">
      <p class="modal-desc" id="modalDesc"></p>
      <div class="modal-docs">
        <h4>📚 Tư liệu tham khảo</h4>
        <ul id="modalSources"></ul>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
